```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Halloween</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #ffe6f0;
            font-family: 'Comic Neue', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: rgba(0, 0, 0, 0.5);

            z-index: 2;
        }

        /* Hộp thông báo */
        .overlay-body {
            background-color: #fff7fa;

            border-radius: 15px;

            padding: 20px;

            text-align: center;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Tiêu đề */
        .overlay-title {
            font-size: 24px;

            color: #ff6f91;

            margin-top: 0;
            margin-bottom: 16px;
        }

        /* Button */
        .overlay-button {
            background-color: #ffb3c1;

            color: white;

            border: none;

            padding: 10px 20px;

            border-radius: 20px;

            margin: 5px;

            cursor: pointer;

            font-size: 16px;

            transition: background-color 0.2s ease;
        }

        .overlay-button:hover {
            background-color: #ff8c9f;
        }

        /* Video container */
        .scare {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            z-index: 1;

            display: none;

            background: #000;
        }

        /* Video */
        video {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }
    </style>
</head>

<body>

    <!-- Overlay -->
    <div id="overlay" class="overlay">

        <div class="overlay-body">

            <p class="overlay-title">
                Mày có sợ không
            </p>

            <button
                id="accept-button"
                class="overlay-button">
                  Có
            </button>

            <button
                id="decline-button"
                class="overlay-button">
                🕸 không
            </button>

        </div>

    </div>

    <!-- Video -->
    <div id="scare" class="scare">

        <video
            id="video"
            src="love.mp4"
            autoplay
            playsinline
            controls>
        </video>

    </div>

    <script>

        const overlay =
            document.getElementById("overlay");

        const scare =
            document.getElementById("scare");

        const video =
            document.getElementById("video");

        const acceptButton =
            document.getElementById("accept-button");

        const declineButton =
            document.getElementById("decline-button");


        function startVideo() {

            // Ẩn overlay
            overlay.style.display = "none";

            // Hiện video
            scare.style.display = "block";

            // Phát video
            video.play().catch(function(error) {
                console.log(
                    "Không thể tự động phát video:",
                    error
                );
            });

        }


        // Nút SI
        acceptButton.addEventListener(
            "click",
            startVideo
        );


        // Nút NO
        declineButton.addEventListener(
            "click",
            startVideo
        );

    </script>

</body>

</html>
```
